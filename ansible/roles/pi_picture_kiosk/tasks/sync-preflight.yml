---
- name: Validate photo sync settings
  ansible.builtin.assert:
    that:
      - (frame_nas_photo_subdir | default('media/photos') | length) > 0
      - not (frame_nas_photo_subdir | default('media/photos')).startswith('/')
      - "'..' not in (frame_nas_photo_subdir | default('media/photos'))"
      - (frame_sync_min_free_bytes | default(1073741824) | string) is match('^[0-9]+$')
    fail_msg: Photo sync needs a relative photo source folder and a nonnegative integer free-space reserve.

- name: Inspect existing media sync units before deployment
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - "{{ item }}"
      - --property=LoadState
      - --value
  loop:
    - piframe-media-sync.timer
    - piframe-media-sync.service
    - pi-picture-kiosk-sync.timer
    - pi-picture-kiosk-sync.service
  register: piframe_sync_unit_states
  changed_when: false
  check_mode: false

- name: Pause existing media sync before replacing scripts
  ansible.builtin.systemd:
    name: "{{ item.item }}"
    state: stopped
  loop: "{{ piframe_sync_unit_states.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: (item.stdout | trim) == 'loaded'
