---
- name: Disable old sync units
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
    daemon_reload: true
  loop:
    - pi-picture-kiosk-sync.timer
    - pi-picture-kiosk-sync.service
  failed_when: false

- name: Remove old sync unit files
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop:
    - pi-picture-kiosk-sync.timer
    - pi-picture-kiosk-sync.service
  notify: Reload systemd

- name: Install backend systemd service
  ansible.builtin.template:
    src: pi-picture-kiosk.service.j2
    dest: /etc/systemd/system/pi-picture-kiosk.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart pi picture kiosk

- name: Install sync systemd service
  ansible.builtin.template:
    src: piframe-media-sync.service.j2
    dest: /etc/systemd/system/piframe-media-sync.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install sync systemd timer
  ansible.builtin.template:
    src: piframe-media-sync.timer.j2
    dest: /etc/systemd/system/piframe-media-sync.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable backend service
  ansible.builtin.systemd:
    name: pi-picture-kiosk.service
    enabled: true
    state: started
    daemon_reload: true

- name: Configure sync timer
  ansible.builtin.systemd:
    name: piframe-media-sync.timer
    enabled: "{{ frame_sync_timer_enabled | default(true) | bool }}"
    state: "{{ 'started' if (frame_sync_timer_enabled | default(true) | bool) else 'stopped' }}"
    daemon_reload: true
