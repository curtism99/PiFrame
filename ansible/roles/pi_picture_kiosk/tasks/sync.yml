---
- name: Add NAS hosts entry
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^.*\s{{ frame_nas_hostname }}(\s|$).*$'
    line: "{{ ([frame_nas_ip, frame_nas_hostname] + (frame_nas_aliases | default([]))) | join(' ') }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - frame_nas_ip is defined
    - frame_nas_hostname is defined
    - frame_nas_ip | length > 0
    - frame_nas_hostname | length > 0

- name: Create NAS mount point
  ansible.builtin.file:
    path: "{{ frame_nas_mount_point }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Template sync script
  ansible.builtin.template:
    src: sync-from-nas.sh.j2
    dest: "{{ frame_app_dir }}/scripts/sync-from-nas.sh"
    owner: root
    group: root
    mode: "0755"
